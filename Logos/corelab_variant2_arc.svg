<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>CoReLab – Variant 2 C as Arc</title>

  <!-- C arc: center (53,56), R=26, gap ±55° at 3 o'clock -->
  <!-- Bottom tip: (53+26*cos55, 56+26*sin55) = (68, 77) -->
  <!-- Top tip:    (53+26*cos55, 56-26*sin55) = (68, 35) -->
  <path d="M68,77 A26,26 0 1,1 68,35" fill="none" stroke="#0062A3" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Inner ring -->
  <circle cx="53" cy="56" r="17" fill="none" stroke="#A8CBEA" stroke-width="1.8"/>
  <!-- Core -->
  <circle cx="53" cy="56" r="10" fill="#0062A3"/>
  <!-- Nucleus -->
  <circle cx="53" cy="56" r="3.8" fill="#A8CBEA"/>

  <!-- Wordmark: starts just after arc tip x=68 -->
  <text x="76" y="76" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#0062A3" letter-spacing="-1">o<tspan fill="#4A9AD4">Re</tspan><tspan font-weight="300">Lab</tspan></text>

  <!-- Tagline -->
  <text x="33" y="101" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444" letter-spacing="2.5">COMPUTATIONAL RESEARCH LABORATORY</text>
  <text x="33" y="116" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#A8CBEA" letter-spacing="1.5">University of Stavanger</text>
</svg>
